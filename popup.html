<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Enhancer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 200px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      color: #e0e0e8;
      padding: 20px;
    }

    .popup-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .popup-header svg {
      flex-shrink: 0;
    }

    .popup-header h1 {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #818cf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .popup-domain {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 8px;
    }
    
    .toggle-row.domain-toggle {
      background: rgba(99, 102, 241, 0.08);
      border-color: rgba(99, 102, 241, 0.2);
    }
    
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 12px 0;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 500;
    }

    #openSettings:hover {
      background: rgba(99,102,241,0.12) !important;
      color: #818cf8 !important;
      border-color: rgba(99,102,241,0.3) !important;
    }

    /* Toggle Switch */
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      cursor: pointer;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.12);
      transition: background 0.25s ease;
    }

    .toggle-slider::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .toggle-switch input:checked + .toggle-slider {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }

    .toggle-switch input:checked + .toggle-slider::after {
      transform: translateX(20px);
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.5);
    }

    .status-text {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      color: #6b7280;
    }

    .status-text span {
      font-weight: 600;
    }

    .status-text .on {
      color: #22c55e;
    }

    .status-text .off {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect width="28" height="28" rx="8" fill="url(#g1)" />
      <path d="M10 8.5v11l9-5.5-9-5.5z" fill="#fff" fill-opacity="0.9"/>
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="28" y2="28">
          <stop stop-color="#6366f1" />
          <stop offset="1" stop-color="#8b5cf6" />
        </linearGradient>
      </defs>
    </svg>
    <h1>Video Enhancer</h1>
  </div>

  <div class="popup-domain" id="domainText">—</div>

  <div class="toggle-row domain-toggle">
    <span class="toggle-label">Enable on this site</span>
    <label class="toggle-switch">
      <input type="checkbox" id="toggleEnabled" />
      <span class="toggle-slider"></span>
    </label>
  </div>
  
  <div class="status-text" id="statusText"></div>

  <div class="divider"></div>

  <div class="toggle-row">
    <span class="toggle-label">Auto-Pause on Tab Switch</span>
    <label class="toggle-switch">
      <input type="checkbox" id="toggleAutoPause" />
      <span class="toggle-slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Anti-Redirect & Ads</span>
    <label class="toggle-switch">
      <input type="checkbox" id="toggleAntiRedirect" />
      <span class="toggle-slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Show Floating Panel</span>
    <label class="toggle-switch">
      <input type="checkbox" id="toggleShowPanel" />
      <span class="toggle-slider"></span>
    </label>
  </div>

  <button id="openSettings" style="
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    margin-top: 14px;
    padding: 9px 0;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    color: #9ca3af;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  ">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Settings
  </button>

  <script src="popup.js"></script>
</body>
</html>
